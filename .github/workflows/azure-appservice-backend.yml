name: Deploy Spring Boot (WAR) to Azure App Service

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/azure-appservice-backend.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend (WAR)
        working-directory: backend
        run: mvn -U clean package -DskipTests

      - name: Deploy WAR to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: "katsu"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: backend/target/*.war

