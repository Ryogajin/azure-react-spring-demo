name: Deploy Spring Boot (WAR) to Azure App Service (Tomcat ROOT)

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/azure-appservice-backend.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend (WAR)
        working-directory: backend
        run: mvn -U clean package -DskipTests

      # 切り分け：成果物確認
      - name: List target artifacts
        run: ls -al backend/target

      # Tomcat が拾う配置にする：deploy/webapps/ROOT.war を作って zip にまとめる
      - name: Create deployment zip for Tomcat (webapps/ROOT.war)
        run: |
          rm -rf deploy
          mkdir -p deploy/webapps
          cp backend/target/*.war deploy/webapps/ROOT.war
          echo "=== deploy/webapps ==="
          ls -al deploy/webapps
          cd deploy
          zip -r app.zip .
          echo "=== deploy/app.zip ==="
          ls -al app.zip

      - name: Deploy ZIP to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: "katsu"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: deploy/app.zip

