spring.application.name=demo

# Server
server.port=${SERVER_PORT:8080}

# Datasource (Azure SQL / SQL Server)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=appdb;encrypt=true;trustServerCertificate=true;loginTimeout=30;}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong!Passw0rd}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:change-me-in-prod-please-change-me}
app.jwt.issuer=${JWT_ISSUER:azure-demo}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}

# Admin bootstrap user (created when no users exist)
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin1234!}
app.bootstrap-admin.display-name=${BOOTSTRAP_ADMIN_DISPLAYNAME:Administrator}

# Azure Files (mounted path on backend VM, e.g. Z:\\ )
app.azurefiles.path=${AZURE_FILES_PATH:}
